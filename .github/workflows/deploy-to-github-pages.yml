name: Deploy Portfolio with Existing Blog and Config Files via Manual Git

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # --- Build the portfolio site ---
      - name: Checkout Portfolio Source Repository
        uses: actions/checkout@v3
        with:
          path: portfolio-repo # Checks out the repo containing this workflow

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18" # Or your required version

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10 # Supports the v9 lockfile while remaining compatible with Node 18
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('portfolio-repo/**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Portfolio Dependencies
        working-directory: ./portfolio-repo
        run: pnpm install

      - name: Build Portfolio App
        working-directory: ./portfolio-repo
        run: pnpm run build # Output goes to portfolio-repo/dist

      # --- Prepare and Deploy Manually ---
      - name: Clone Target GitHub Pages Repository
        run: |
          # Clone only the latest commit history depth 1 for speed if full history isn't needed
          git clone --depth 1 https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/hallucinogenizer/hallucinogenizer.github.io.git deploy-repo
        # Ensure DEPLOY_TOKEN has repo scope permissions for hallucinogenizer.github.io

      - name: Deploy Portfolio Build into GitHub Pages Repo
        run: |
          cd deploy-repo

          echo "Configuring git user..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The portfolio build owns ONLY the top-level paths that appear in
          # portfolio-repo/dist (currently: index.html and assets/). We remove
          # just those paths from the deploy repo so stale, content-hashed asset
          # files are cleaned up, then copy the fresh build in.
          #
          # Everything else living in the Pages repo is left completely untouched:
          #   - blog/            (the separately-built Next.js blog)
          #   - financial-report/
          #   - zohoverify/
          #   - CNAME, .nojekyll, and anything added in the future
          #
          # This is what prevents deploys from wiping non-portfolio content.
          echo "Removing previous portfolio files (only the paths this build produces)..."
          for entry in ../portfolio-repo/dist/* ../portfolio-repo/dist/.[!.]*; do
            [ -e "$entry" ] || continue
            name="$(basename "$entry")"
            echo "  - replacing ./$name"
            rm -rf "./$name"
          done

          echo "Copying fresh portfolio build in (including any dotfiles)..."
          cp -a ../portfolio-repo/dist/. .

          # A single root .nojekyll disables Jekyll for the WHOLE site, so
          # underscore-prefixed dirs like blog/_next are served as-is.
          touch .nojekyll

          echo "Top-level contents of deploy repo after copy:"
          ls -A

          echo "Staging changes..."
          git add -A

          echo "Changes to be committed:"
          git status -s

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Deploy portfolio (portfolio files only, preserving other content) - $(date -u)"
            echo "Pushing changes..."
            git push origin main # Make sure 'main' is your target branch
          fi
        env:
          GIT_TOKEN: ${{ secrets.DEPLOY_TOKEN }} # Often not needed directly, but available if git commands require it
